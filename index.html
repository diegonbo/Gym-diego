<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0c0c0c">
<title>Diego — Entreno</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0c0c0c; --surface:#141414; --card:#1a1a1a;
  --border:rgba(255,255,255,0.07);
  --accent:#e8ff47; --green:#4ade80; --blue:#60d0ff; --orange:#ff8c5a;
  --green-dim:rgba(74,222,128,0.1);
  --muted:#555; --muted2:#888; --text:#f0f0f0;
  --prot-color:#60d0ff; --carb-color:#e8ff47; --fat-color:#ff8c5a;
  --nav-h:62px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;min-height:100vh;min-height:100dvh;overscroll-behavior:none}

/* ── BOTTOM NAV ── */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:200;background:var(--surface);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(2,1fr);height:var(--nav-h);padding-bottom:env(safe-area-inset-bottom)}
.nav-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;border:none;background:none;color:var(--muted2);font-family:'Barlow',sans-serif;font-size:11px;letter-spacing:1px;text-transform:uppercase;padding-top:6px;transition:color 0.2s}
.nav-btn.active{color:var(--accent)}
.nav-icon{font-size:20px;line-height:1}
.nav-btn.active .nav-gym-icon{color:var(--accent)}
.nav-btn.active .nav-diet-icon{color:var(--green)}
.nav-hist-btn.active{color:var(--blue)}

/* ── HISTORIAL ── */
.hist-topbar{position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:1px solid var(--border);padding:14px 20px 12px;display:flex;align-items:center;justify-content:space-between}
.hist-title{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--blue)}
.hist-sub{font-size:12px;color:var(--muted2);letter-spacing:1px;margin-top:1px}
.hist-actions{display:flex;gap:8px;padding:12px 16px}
.hist-act-btn{flex:1;background:var(--card);border:1px solid var(--border);color:var(--muted2);font-family:'Barlow',sans-serif;font-size:12px;font-weight:500;padding:9px 6px;border-radius:8px;cursor:pointer}
.hist-act-btn:active{border-color:var(--blue);color:var(--blue)}
.hist-empty{padding:48px 28px;text-align:center;color:var(--muted2);font-size:14px;line-height:1.7}
.sess-card{margin:0 16px 10px;background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.sess-head{padding:13px 16px;display:flex;align-items:center;gap:12px;cursor:pointer}
.sess-date{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;letter-spacing:.5px}
.sess-meta{font-size:11px;color:var(--muted2);margin-top:2px}
.sess-vol{margin-left:auto;text-align:right;flex-shrink:0}
.sess-vol-n{font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:700;line-height:1}
.sess-vol-l{font-size:9px;color:var(--muted);letter-spacing:1px;text-transform:uppercase}
.sess-delta{font-size:11px;font-weight:600;margin-top:2px}
.sess-body{display:none;border-top:1px solid var(--border);padding:10px 16px 14px}
.sess-card.open .sess-body{display:block}
.sess-ex{padding:7px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.sess-ex:last-child{border-bottom:none}
.sess-ex-name{font-size:13px;font-weight:500;margin-bottom:3px}
.sess-sets{display:flex;flex-wrap:wrap;gap:5px}
.sess-set{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:600;background:rgba(255,255,255,.05);border-radius:5px;padding:2px 7px;color:var(--muted2)}
.sess-set b{color:var(--accent);font-weight:700}
.sess-set i{color:var(--blue);font-style:normal;font-weight:700}
.sess-del{background:none;border:none;color:var(--muted);font-size:12px;font-family:'Barlow',sans-serif;padding:8px 0 0;cursor:pointer}

/* ── GUARDAR SESION ── */
.save-wrap{margin:18px 16px 8px}
.save-btn{width:100%;background:var(--green-dim);border:1px solid rgba(74,222,128,.35);color:var(--green);font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:14px;border-radius:12px;cursor:pointer}
.save-btn:active{transform:scale(.985)}
.save-hint{font-size:11px;color:var(--muted);text-align:center;margin-top:8px;line-height:1.5}
.last-line{font-size:11px;color:var(--blue);margin-bottom:10px;letter-spacing:.3px}
.nav-diet-btn.active{color:var(--green)}

/* ── SCREENS ── */
.screen{display:none;padding-bottom:calc(var(--nav-h) + 16px)}
.screen.active{display:block}

/* ══════════════════════════════
   GYM SCREEN
══════════════════════════════ */
.topbar{position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:1px solid var(--border);padding:14px 20px 12px;display:flex;align-items:center;justify-content:space-between}
.topbar-title{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:700;letter-spacing:2px;text-transform:uppercase}
.topbar-date{font-size:12px;color:var(--muted2);letter-spacing:1px;margin-top:1px}
.reset-btn{background:none;border:1px solid var(--border);color:var(--muted);font-size:12px;font-family:'Barlow',sans-serif;padding:5px 10px;border-radius:6px;cursor:pointer}

.week-strip{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--border)}
.week-day{padding:10px 4px 8px;text-align:center;cursor:pointer;border-right:1px solid var(--border);position:relative;transition:background 0.15s}
.week-day:last-child{border-right:none}
.week-day .wd-name{font-size:10px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:4px}
.week-day .wd-type{font-size:9px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase}
.week-day.active{background:rgba(255,255,255,0.04)}
.week-day.active::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--day-color,var(--accent))}
.week-day.rest-day{opacity:.35;cursor:default}
.wd-dot{width:6px;height:6px;border-radius:50%;background:var(--day-color,var(--muted));margin:0 auto 4px}

.session-header{padding:24px 20px 16px}
.session-type-tag{display:inline-block;font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:3px 10px;border-radius:4px;margin-bottom:10px}
.session-title{font-family:'Barlow Condensed',sans-serif;font-size:32px;font-weight:700;letter-spacing:1px;line-height:1.1;margin-bottom:6px}
.session-meta{font-size:13px;color:var(--muted2);display:flex;gap:16px}

.progress-wrap{padding:0 20px 20px}
.progress-label{display:flex;justify-content:space-between;font-size:12px;color:var(--muted2);margin-bottom:6px}
.progress-bar{height:3px;background:var(--border);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:var(--day-color,var(--accent));border-radius:2px;transition:width 0.4s}

.complete-banner{margin:16px 16px 8px;background:var(--green-dim);border:1px solid rgba(74,222,128,.3);border-radius:12px;padding:16px 20px;display:none;align-items:center;gap:12px}
.complete-banner.show{display:flex}
.cb-text{font-size:14px;color:var(--green);font-weight:500}
.cb-sub{font-size:12px;color:var(--muted2);margin-top:2px}

.section-label{padding:8px 20px 6px;font-size:10px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--muted);border-top:1px solid var(--border)}

.exercise-card{margin:0 16px 10px;background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;transition:border-color 0.2s}
.exercise-card.done{border-color:rgba(74,222,128,.25);background:rgba(74,222,128,.04)}
.ex-main{display:flex;align-items:center;padding:14px 16px;gap:14px;cursor:pointer}
.ex-check{width:24px;height:24px;border-radius:50%;border:2px solid var(--muted);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all 0.2s;font-size:13px}
.exercise-card.done .ex-check{background:var(--green);border-color:var(--green);color:#0c0c0c}
.ex-info{flex:1;min-width:0}
.ex-name{font-size:15px;font-weight:500;margin-bottom:2px;line-height:1.3}
.exercise-card.done .ex-name{color:var(--muted2);text-decoration:line-through;text-decoration-color:var(--muted)}
.ex-sets{font-size:13px;color:var(--muted2)}
.ex-toggle{font-size:18px;color:var(--muted);transition:transform 0.2s;flex-shrink:0}
.exercise-card.open .ex-toggle{transform:rotate(180deg)}
.ex-detail{display:none;padding:0 16px 14px 54px}
.exercise-card.open .ex-detail{display:block}
.ex-note{font-size:13px;color:var(--muted2);line-height:1.6;margin-bottom:12px;font-style:italic}

.sets-tracker{display:flex;flex-direction:column;gap:8px}
.set-row{display:flex;align-items:center;gap:10px}
.set-bubble{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--muted);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;color:var(--muted2);cursor:pointer;transition:all 0.18s;font-family:'Barlow Condensed',sans-serif;flex-shrink:0}
.set-bubble.done-set{background:var(--green-dim);border-color:var(--green);color:var(--green)}
.set-bubble:active{transform:scale(.9)}
.set-weight-wrap{display:flex;align-items:center;gap:5px;flex:1;min-width:0}
.set-weight-input{width:100%;min-width:0;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:600;padding:6px 4px;text-align:center;outline:none;transition:border-color 0.15s;-moz-appearance:textfield}
.set-weight-input::-webkit-outer-spin-button,.set-weight-input::-webkit-inner-spin-button{-webkit-appearance:none}
.set-weight-input:focus{border-color:var(--muted2)}
.set-weight-input.has-value{border-color:var(--muted);color:var(--accent)}
.set-weight-input.set-reps-input.has-value{color:var(--blue)}
.set-field{display:flex;align-items:center;gap:4px;flex:1;min-width:0}
.set-weight-unit{font-size:12px;color:var(--muted);flex-shrink:0}
.set-x{font-size:13px;color:var(--muted);flex-shrink:0;padding:0 1px}


/* ── SESSION TIMER ── */
.session-timer{margin:0 16px 12px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.st-item{display:flex;flex-direction:column;align-items:center;gap:2px;flex:1}
.st-label{font-size:9px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
.st-val{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;color:var(--text)}
.st-val.active{color:var(--accent)}
.st-sep{color:var(--muted);font-size:18px;padding-top:10px}

.rest-screen{padding:48px 24px;text-align:center}
.rest-icon{font-size:48px;margin-bottom:20px}
.rest-title{font-family:'Barlow Condensed',sans-serif;font-size:36px;font-weight:700;letter-spacing:2px;margin-bottom:10px}
.rest-sub{font-size:15px;color:var(--muted2);line-height:1.7}


@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.anim{animation:fadeUp 0.25s ease forwards}
</style>
</head>
<body>

<!-- ══ GYM SCREEN ══ -->
<div id="screen-gym" class="screen active">
  <div class="topbar">
    <div>
      <div class="topbar-title" style="color:var(--accent)">ENTRENO</div>
      <div class="topbar-date" id="topbar-date"></div>
    </div>
    <button class="reset-btn" onclick="resetDay()">↺ Reiniciar</button>
  </div>
  <div class="week-strip" id="weekStrip"></div>
  <div id="gymContent"></div>
</div>


<!-- ══ HISTORIAL SCREEN ══ -->
<div id="screen-hist" class="screen">
  <div class="hist-topbar">
    <div>
      <div class="hist-title">HISTORIAL</div>
      <div class="hist-sub" id="hist-sub"></div>
    </div>
  </div>
  <div class="hist-actions">
    <button class="hist-act-btn" onclick="exportData()">⧉ Copiar</button>
    <button class="hist-act-btn" onclick="downloadData()">↓ Bajar</button>
    <button class="hist-act-btn" onclick="importData()">↑ Importar</button>
  </div>
  <div id="histContent"></div>
</div>

<!-- ══ BOTTOM NAV ══ -->
<div class="bottom-nav">
  <button class="nav-btn active" id="nav-gym" onclick="setScreen('gym')">
    <div class="nav-icon nav-gym-icon">💪</div>
    <span>Entreno</span>
  </button>

  <button class="nav-btn nav-hist-btn" id="nav-hist" onclick="setScreen('hist')">
    <div class="nav-icon">📈</div>
    <span>Historial</span>
  </button>
</div>

<script>
/* ═══════════════════════════════════════
   DATA — GYM
═══════════════════════════════════════ */
const DAYS = [
  { id:'lun', name:'Lun', shortName:'Lunes', type:'padel', label:'Padel', color:'#4ade80' },
  {
    id:'mar', name:'Mar', shortName:'Martes', type:'push', label:'Push', color:'#e8ff47',
    title:'Push Day', subtitle:'Pecho · Hombros · Tríceps · Core', duration:'55-60 min',
    sections:[
      { name:'Pecho', exercises:[
        { name:'Press banca plano con barra', sets:4, reps:'6-8', note:'Descendé controlado 3 seg. Progresá 2.5kg cuando completes todas las reps. ⚠️ Cargá solo el peso de UN lado — la app suma el otro lado + 20kg de barra.', banca:true },
        { name:'Press inclinado con mancuernas (30°)', sets:3, reps:'8-10', note:'Ángulo 30°, no más. Énfasis en pec superior.' },
        { name:'Aperturas en polea cruzada', lbs:true, sets:3, reps:'12-15', note:'Bombeo, peso moderado. Contracción completa en el centro, sin inercia.' },
      ]},
      { name:'Hombros · Tríceps', exercises:[
        { name:'Press militar en máquina', sets:3, reps:'8-10', note:'Único empuje vertical de la semana. No arquees la lumbar.' },
        { name:'Elevaciones laterales', sets:4, reps:'12-15', note:'Peso liviano, descanso corto. Codo ligeramente flexionado. Es el trabajo que más ancho de hombro te da.' },
        { name:'Tríceps con soga en polea', lbs:true, sets:3, reps:'10-12', note:'Abrí las manos al final del recorrido para extensión completa.' },
      ]},
      { name:'Finisher · Core', exercises:[
        { name:'Flexiones de pecho', sets:3, reps:'hasta fallo', note:'Al final de la sesión, sin peso adicional. Llegá al fallo real.' },
        { name:'Ab wheel / plancha dinámica', sets:3, reps:'8-10', note:'Antiextensión. Columna neutra durante todo el movimiento.' },
      ]},
    ]
  },
  {
    id:'mie', name:'Mié', shortName:'Miércoles', type:'pull', label:'Pull', color:'#60d0ff',
    title:'Pull Day', subtitle:'Espalda · Bíceps · Core', duration:'55-60 min',
    sections:[
      { name:'Espalda', exercises:[
        { name:'Dominadas', sets:3, reps:'máx', note:'Agarre pronado. Llevá el pecho hacia la barra. Si no llegás a 5, hacé asistidas o jalón.' },
        { name:'Jalón al pecho en máquina', sets:4, reps:'8-10', note:'Retracción escapular completa. Codos hacia abajo y atrás.' },
        { name:'Remo con mancuerna a un brazo', sets:4, reps:'10-12 c/brazo', note:'Espalda paralela al piso. Codo hacia la cadera, sin rotar el torso.' },
        { name:'Remo en polea baja sentado', sets:3, reps:'10-12', note:'Retracción escapular completa al final. Codos pegados al cuerpo.' },
        { name:'Face pull en polea (cuerda)', lbs:true, sets:3, reps:'15', note:'Rotación externa de hombros al final. Esencial después del padel del lunes.' },
      ]},
      { name:'Bíceps', exercises:[
        { name:'Curl con barra EZ', sets:3, reps:'8-10', note:'Subí la carga — estás estancado. Sin oscilar el torso. Codos fijos.' },
        { name:'Curl martillo con mancuernas', sets:2, reps:'10-12', note:'Trabaja braquial y braquiorradial.' },
      ]},
      { name:'Core — Antirrotación', exercises:[
        { name:'Pallof press en polea', lbs:true, sets:3, reps:'12 c/lado', note:'Caderas cuadradas durante todo el movimiento. Resistí la rotación.' },
      ]},
    ]
  },
  {
    id:'jue', name:'Jue', shortName:'Jueves', type:'legs', label:'Legs', color:'#ff8c5a',
    title:'Leg Day', subtitle:'Piernas · Glúteos · Core', duration:'60-65 min',
    sections:[
      { name:'Cuádriceps · Glúteos', exercises:[
        { name:'Sentadilla con barra', sets:4, reps:'6-8', note:'Por debajo de paralelo. Rodillas en línea con los pies. Subí más rápido — las piernas aguantan más carga.' },
        { name:'Sentadilla búlgara con mancuernas', sets:3, reps:'8-10 c/pierna', note:'Pie trasero elevado. La rodilla de adelante no se va hacia adentro.' },
        { name:'Prensa 45°', sets:3, reps:'10', note:'Rango completo. No bloquees las rodillas arriba.' },
      ]},
      { name:'Isquios · Glúteos · Gemelos', exercises:[
        { name:'Peso muerto rumano', sets:4, reps:'8', note:'Barra cerca del cuerpo. Sentís el estiramiento en isquios. Subí más rápido también.' },
        { name:'Curl femoral tumbado', lbs:true, sets:3, reps:'12', note:'Controlá la bajada. No uses inercia ni levantés las caderas.' },
        { name:'Elevación de gemelos de pie', sets:3, reps:'15-20', note:'Pausa 1 seg arriba y 1 seg abajo. Rango completo.' },
      ]},
      { name:'Core', exercises:[
        { name:'Cable crunch en polea alta', lbs:true, sets:3, reps:'15', note:'Flexión de columna, no de caderas. Codos fijos a los costados de la cabeza.' },
        { name:'Patadas al cielo (hip thrust en suelo)', sets:3, reps:'12', note:'Enrollá la pelvis al final. Mantené el core apretado durante todo el movimiento.' },
      ]},
    ]
  },
  { id:'vie', name:'Vie', shortName:'Viernes', type:'rest', label:'Desc.', color:'#444' },
  { id:'sab', name:'Sáb', shortName:'Sábado', type:'rest', label:'Desc.', color:'#444' },
  { id:'dom', name:'Dom', shortName:'Domingo', type:'rest', label:'Desc.', color:'#444' },
];

const DAY_JS_TO_IDX = [6,0,1,2,3,4,5];
let activeDay = DAY_JS_TO_IDX[new Date().getDay()];
let gymState = JSON.parse(localStorage.getItem('rutina_state') || '{}');

/* ── MIGRACIÓN v1 → v3: reordenamiento de días y ejercicios ──
   Push pasa de martes a jueves, Pull de miércoles a martes, Legs de jueves a miércoles.
   Los pesos se guardaban por posición, así que hay que remapearlos o quedan en el
   ejercicio equivocado. Corre una sola vez. */
const ROUTINE_VER = 4;
(function migrateRoutine() {
  if (parseInt(localStorage.getItem('rutina_ver') || '1', 10) >= ROUTINE_VER) return;
  // v3→v4: Push vuelve a martes, Pull a miércoles, Legs a jueves
  // Estructura nueva: mar=push(8ex), mie=pull(8ex), jue=legs(8ex)
  // No remapeamos pesos — el usuario los va a cargar de nuevo con la rutina nueva
  const MAP = {};
  const out = {};
  Object.keys(gymState).forEach(k => {
    const m = k.match(/^(lun|mar|mie|jue|vie|sab|dom)_(\d+)(.*)$/);
    if (!m) { out[k] = gymState[k]; return; }
    const rule = MAP[m[1]];
    if (!rule) { out[k] = gymState[k]; return; }
    const ni = rule.idx[parseInt(m[2], 10)];
    if (ni === undefined) return;
    out[rule.day + '_' + ni + m[3]] = gymState[k];
  });
  gymState = out;
  localStorage.setItem('rutina_state', JSON.stringify(gymState));
  localStorage.setItem('rutina_ver', String(ROUTINE_VER));
})();
let sessionLog = JSON.parse(localStorage.getItem('rutina_history') || '[]');
function saveHistory() { localStorage.setItem('rutina_history', JSON.stringify(sessionLog)); }

function lastDone(dayId, exName) {
  for (let i = sessionLog.length - 1; i >= 0; i--) {
    if (sessionLog[i].dayId !== dayId) continue;
    const e = sessionLog[i].exercises.find(x => x.name === exName);
    if (e) return { sets: e.sets, date: sessionLog[i].date };
  }
  return null;
}
function fmtDate(iso) {
  const d = new Date(iso + 'T12:00:00');
  return d.toLocaleDateString('es-AR', { day:'2-digit', month:'2-digit' });
}
function volume(exercises) {
  let v = 0;
  exercises.forEach(e => e.sets.forEach(s => {
    const kg = parseFloat(s.kg), r = parseFloat(s.reps);
    if (!isNaN(kg) && !isNaN(r)) v += kg * r;
  }));
  return Math.round(v);
}

function getKey(dayId, exIdx) { return `${dayId}_${exIdx}`; }
function getSetKey(dayId, exIdx, setIdx) { return `${dayId}_${exIdx}_s${setIdx}`; }
function saveGymState() { localStorage.setItem('rutina_state', JSON.stringify(gymState)); }

function resetDay() {
  const day = DAYS[activeDay];
  if (!day.sections) return;
  if (!confirm(`¿Reiniciar el progreso de ${day.shortName}?`)) return;
  Object.keys(gymState).filter(k => k.startsWith(day.id + '_')).forEach(k => delete gymState[k]);
  saveGymState(); renderGym();
}

function renderTopDate() {
  document.getElementById('topbar-date').textContent =
    new Date().toLocaleDateString('es-AR', { weekday:'long', day:'numeric', month:'long' });
}

function renderWeekStrip() {
  document.getElementById('weekStrip').innerHTML = DAYS.map((d,i) => {
    const isRest = d.type === 'rest';
    return `<div class="week-day ${i===activeDay?'active':''} ${isRest?'rest-day':''}"
      style="--day-color:${d.color}" onclick="${isRest?'':  `setDay(${i})`}">
      <div class="wd-name">${d.name}</div>
      <div class="wd-dot"></div>
      <div class="wd-type" style="color:${d.color}">${d.label}</div>
    </div>`;
  }).join('');
}

function setDay(i) {
  activeDay = i;
  renderWeekStrip(); renderGym();
  document.getElementById('screen-gym').scrollTo({ top:0, behavior:'smooth' });
}

function calcProgress(day) {
  if (!day.sections) return { done:0, total:0 };
  let done=0, total=0, g=0;
  day.sections.forEach(s => s.exercises.forEach(() => { total++; if (gymState[getKey(day.id,g)]) done++; g++; }));
  return { done, total };
}

function renderGym() {
  const day = DAYS[activeDay];
  const content = document.getElementById('gymContent');

  if (day.type === 'rest') {
    content.innerHTML = `<div class="anim rest-screen"><div class="rest-icon">😴</div><div class="rest-title">DESCANSO</div><div class="rest-sub">La recuperación es parte del entrenamiento.<br>Hidratate, dormí bien y llegá fresco.</div></div>`;
    return;
  }
  if (day.type === 'padel') {
    content.innerHTML = `<div class="anim rest-screen"><div class="rest-icon">🎾</div><div class="rest-title">NOCHE DE PADEL</div><div class="rest-sub">Cardio + potencia cubiertos.<br>Calentá bien y disfrutalo.<br><br><span style="color:var(--muted);font-size:12px">Mañana: Pull Day</span></div></div>`;
    return;
  }

  const { done, total } = calcProgress(day);
  const pct = total ? Math.round(done/total*100) : 0;
  const allDone = done === total && total > 0;

  let html = `<div class="anim">
    <div class="session-header">
      <div class="session-type-tag" style="background:${day.color}22;color:${day.color}">${day.type.toUpperCase()}</div>
      <div class="session-title" style="color:${day.color}">${day.title}</div>
      <div class="session-meta"><span>⏱ ${day.duration}</span><span style="color:${day.color}">${done}/${total} ejercicios</span></div>
    </div>
    <div class="progress-wrap" style="--day-color:${day.color}">
      <div class="progress-label"><span>Progreso</span><span>${pct}%</span></div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    </div>
    ${renderTimerHTML(day.id)}
    <div class="complete-banner ${allDone?'show':''}">
      <div style="font-size:24px">🏆</div>
      <div><div class="cb-text">¡Sesión completada!</div><div class="cb-sub">Excelente trabajo. Recuperate bien.</div></div>
    </div>`;

  let g = 0;
  let prefilled = false;
  day.sections.forEach(sec => {
    html += `<div class="section-label">${sec.name}</div>`;
    sec.exercises.forEach(ex => {
      const isDone = !!gymState[getKey(day.id,g)];
      const isOpen = !!gymState[getKey(day.id,g)+'_open'];
      const prev = lastDone(day.id, ex.name);
      let sets = '';
      for (let s=0; s<ex.sets; s++) {
        const sk = getSetKey(day.id,g,s);
        const kg = gymState[sk+'_kg'] || '';
        const rp = gymState[sk+'_reps'] || '';
        const repUnit = /seg/i.test(ex.reps) ? 'seg' : 'reps';
        const pset = prev && prev.sets[s] ? prev.sets[s] : null;
        // Pre-fill con último valor si el campo está vacío hoy, y persistir en gymState
        const kgVal = kg || (pset && pset.kg ? pset.kg : '');
        const rpVal = rp || (pset && pset.reps ? pset.reps : '');
        if (!kg && kgVal) { gymState[sk+'_kg'] = kgVal; prefilled = true; }
        if (!rp && rpVal) { gymState[sk+'_reps'] = rpVal; prefilled = true; }
        const kgHint = pset && pset.kg ? pset.kg : '—';
        const repHint = (pset && pset.reps) ? pset.reps : (ex.reps.match(/\d+(-\d+)?/) || ['—'])[0];
        sets += `<div class="set-row">
          <div class="set-bubble ${gymState[sk]?'done-set':''}" onclick="toggleSet('${day.id}',${g},${s},event)">S${s+1}</div>
          <div class="set-weight-wrap">
            <div class="set-field">
              <input type="number" inputmode="decimal" placeholder="${kgHint}"
                class="set-weight-input ${kgVal?'has-value':''}" value="${kgVal}"
                onclick="event.stopPropagation()"
                oninput="saveWeight('${day.id}',${g},${s},this.value)">
              <span class="set-weight-unit">${ex.banca?'kg/lado':ex.lbs?'lbs':'kg'}</span>
            </div>
            <span class="set-x">×</span>
            <div class="set-field">
              <input type="number" inputmode="numeric" placeholder="${repHint}"
                class="set-weight-input set-reps-input ${rpVal?'has-value':''}" value="${rpVal}"
                onclick="event.stopPropagation()"
                oninput="saveReps('${day.id}',${g},${s},this.value)">
              <span class="set-weight-unit">${repUnit}</span>
            </div>
          </div>
        </div>`;
      }
      html += `<div class="exercise-card ${isDone?'done':''} ${isOpen?'open':''}">
        <div class="ex-main" onclick="toggleExOpen('${day.id}',${g})">
          <div class="ex-check" onclick="toggleExDone('${day.id}',${g},event)">${isDone?'✓':''}</div>
          <div class="ex-info"><div class="ex-name">${ex.name}</div><div class="ex-sets">${ex.sets} series × ${ex.reps}</div></div>
          <div class="ex-toggle">⌄</div>
        </div>
        <div class="ex-detail"><div class="ex-note">${ex.note}</div>${prev&&prev.sets.some(s=>s.kg||s.reps)?`<div class="last-line">Última vez (${fmtDate(prev.date)}): ${prev.sets.filter(s=>s.kg||s.reps).map(s=>`${ex.banca&&s.kg?(parseFloat(s.kg)*2+20)+'kg total ('+s.kg+'kg/lado)':s.kg||(ex.lbs?'—lbs':'—kg')}${ex.lbs?' lbs':ex.banca?'':' kg'} × ${s.reps||'—'}`).join('  ·  ')}</div>`:''}<div class="sets-tracker">${sets}</div></div>
      </div>`;
      g++;
    });
  });

  html += `<div class="save-wrap">
    <button class="save-btn" onclick="saveSession()">✓ Guardar sesión</button>
    <div class="save-hint">Archiva pesos y reps con la fecha de hoy y deja el día limpio para la próxima.</div>
  </div>`;

  html += `</div>`;
  if (prefilled) saveGymState();
  content.innerHTML = html;
}

function toggleExOpen(dayId, exIdx) {
  const k = getKey(dayId, exIdx) + '_open';
  gymState[k] = !gymState[k];
  saveGymState(); renderGym();
}

function toggleExDone(dayId, exIdx, e) {
  e.stopPropagation();
  const k = getKey(dayId, exIdx);
  gymState[k] = !gymState[k];
  const day = DAYS.find(d => d.id === dayId);
  let g=0, ex=null;
  day.sections.forEach(s => s.exercises.forEach(e2 => { if (g===exIdx) ex=e2; g++; }));
  if (ex) {
    for (let s=0; s<ex.sets; s++) {
      const sk = getSetKey(dayId, exIdx, s);
      if (gymState[k]) gymState[sk] = true;
      else delete gymState[sk];
    }
  }
  saveGymState(); renderGym();
}

function toggleSet(dayId, exIdx, setIdx, e) {
  e.stopPropagation();
  const sk = getSetKey(dayId, exIdx, setIdx);
  gymState[sk] = !gymState[sk];
  if (gymState[sk]) recordSetTime(dayId);
  const day = DAYS.find(d => d.id === dayId);
  let g=0, ex=null;
  day.sections.forEach(s => s.exercises.forEach(e2 => { if (g===exIdx) ex=e2; g++; }));
  if (ex) gymState[getKey(dayId,exIdx)] = Array.from({length:ex.sets},(_,i)=>gymState[getSetKey(dayId,exIdx,i)]).every(Boolean);
  saveGymState(); renderGym();
}

function refreshInputStates() {
  document.querySelectorAll('.set-weight-input').forEach(inp => inp.classList.toggle('has-value', inp.value !== ''));
}

function saveWeight(dayId, exIdx, setIdx, val) {
  const wk = getSetKey(dayId, exIdx, setIdx) + '_kg';
  val ? gymState[wk]=val : delete gymState[wk];
  saveGymState();
  refreshInputStates();
}

function saveReps(dayId, exIdx, setIdx, val) {
  const rk = getSetKey(dayId, exIdx, setIdx) + '_reps';
  val ? gymState[rk]=val : delete gymState[rk];
  saveGymState();
  refreshInputStates();
}


/* ═══════════════════════════════════════
   HISTORIAL
═══════════════════════════════════════ */
function collectDay(day) {
  const out = [];
  let g = 0;
  day.sections.forEach(sec => sec.exercises.forEach(ex => {
    const sets = [];
    let any = false;
    for (let s = 0; s < ex.sets; s++) {
      const sk = getSetKey(day.id, g, s);
      const kg = gymState[sk+'_kg'] || '';
      const reps = gymState[sk+'_reps'] || '';
      const done = !!gymState[sk];
      if (kg || reps || done) any = true;
      sets.push({ kg, reps, done });
    }
    if (any) out.push({ name: ex.name, section: sec.name, sets });
    g++;
  }));
  return out;
}

function saveSession() {
  const day = DAYS[activeDay];
  if (!day.sections) return;
  const exercises = collectDay(day);
  if (!exercises.length) { alert('No hay nada cargado en este día todavía.'); return; }
  const d = new Date();
  const iso = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  if (!confirm(`¿Guardar la sesión de ${day.shortName} (${exercises.length} ejercicios) en el historial?\n\nEl día queda limpio para la próxima vez.`)) return;
  sessionLog.push({ id: day.id+'-'+Date.now(), date: iso, ts: Date.now(), dayId: day.id, title: day.title || day.shortName, exercises });
  saveHistory();
  Object.keys(gymState).filter(k => k.startsWith(day.id + '_')).forEach(k => delete gymState[k]);
  saveGymState();
  renderGym(); renderHistory();
  alert('Sesión guardada ✓');
}

function renderHistory() {
  const c = document.getElementById('histContent');
  const sub = document.getElementById('hist-sub');
  sub.textContent = sessionLog.length ? `${sessionLog.length} ${sessionLog.length===1?'sesión guardada':'sesiones guardadas'}` : 'Sin sesiones aún';

  if (!sessionLog.length) {
    c.innerHTML = `<div class="hist-empty">Todavía no guardaste ninguna sesión.<br><br>Cargá pesos y reps en Entreno y tocá <b>Guardar sesión</b> al terminar.</div>`;
    return;
  }

  let html = '';
  const ordered = sessionLog.slice().sort((a,b) => b.ts - a.ts);
  ordered.forEach(s => {
    const vol = volume(s.exercises);
    const prev = ordered.find(o => o.dayId === s.dayId && o.ts < s.ts);
    let delta = '';
    if (prev) {
      const pv = volume(prev.exercises);
      if (pv > 0 && vol > 0) {
        const pct = Math.round((vol - pv) / pv * 100);
        const col = pct > 0 ? 'var(--green)' : (pct < 0 ? 'var(--orange)' : 'var(--muted)');
        delta = `<div class="sess-delta" style="color:${col}">${pct>0?'▲ +':(pct<0?'▼ ':'')}${pct}%</div>`;
      }
    }
    const day = DAYS.find(d => d.id === s.dayId);
    const col = day ? day.color : 'var(--accent)';
    html += `<div class="sess-card" id="sc-${s.id}">
      <div class="sess-head" onclick="toggleSess('${s.id}')">
        <div>
          <div class="sess-date" style="color:${col}">${fmtDate(s.date)} · ${s.title}</div>
          <div class="sess-meta">${s.exercises.length} ejercicios</div>
        </div>
        <div class="sess-vol">
          <div class="sess-vol-n" style="color:${col}">${vol.toLocaleString('es-AR')}</div>
          <div class="sess-vol-l">kg volumen</div>
          ${delta}
        </div>
      </div>
      <div class="sess-body">
        ${s.exercises.map(e => `<div class="sess-ex">
          <div class="sess-ex-name">${e.name}</div>
          <div class="sess-sets">${e.sets.map((x,i) => `<span class="sess-set">S${i+1} <b>${x.kg||'—'}</b>kg × <i>${x.reps||'—'}</i></span>`).join('')}</div>
        </div>`).join('')}
        <button class="sess-del" onclick="delSession('${s.id}',event)">Eliminar esta sesión</button>
      </div>
    </div>`;
  });
  c.innerHTML = html;
}

function toggleSess(id) {
  document.getElementById('sc-'+id).classList.toggle('open');
}

function delSession(id, e) {
  e.stopPropagation();
  if (!confirm('¿Eliminar esta sesión del historial? No se puede deshacer.')) return;
  sessionLog = sessionLog.filter(s => s.id !== id);
  saveHistory(); renderHistory(); renderGym();
}

/* ── EXPORTAR / RESTAURAR ── */
function buildBackup() {
  return JSON.stringify({ app:'gym-diego', version:2, exported:new Date().toISOString(), history:sessionLog, current:gymState }, null, 2);
}

function exportData() {
  const txt = buildBackup();
  const done = () => alert('Copiado ✓\n\nPegalo donde quieras guardarlo (Notas, WhatsApp, mail).');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(done).catch(() => fallbackCopy(txt, done));
  } else fallbackCopy(txt, done);
}

function fallbackCopy(txt, done) {
  const ta = document.createElement('textarea');
  ta.value = txt; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, 999999);
  try { document.execCommand('copy'); done(); } catch(err) { alert('No pude copiar automáticamente. Usá "Bajar".'); }
  document.body.removeChild(ta);
}

function downloadData() {
  const blob = new Blob([buildBackup()], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const d = new Date();
  a.href = url;
  a.download = `gym-diego-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function importData() {
  // Crear input file oculto
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json,application/json';
  inp.style.display = 'none';
  document.body.appendChild(inp);
  inp.addEventListener('change', function() {
    const file = inp.files[0];
    if (!file) { document.body.removeChild(inp); return; }
    const reader = new FileReader();
    reader.onload = function(e) {
      document.body.removeChild(inp);
      let data;
      try { data = JSON.parse(e.target.result); } catch(err) { alert('No pude leer ese archivo — ¿está completo?'); return; }
      if (!data || !Array.isArray(data.history)) { alert('El archivo no tiene el formato esperado.'); return; }
      const known = new Set(sessionLog.map(s => s.id));
      const nuevas = data.history.filter(s => !known.has(s.id));
      if (nuevas.length === 0) { alert('No hay sesiones nuevas — todo ya está en tu historial.'); return; }
      sessionLog = sessionLog.concat(nuevas).sort((a,b) => (a.ts||0) - (b.ts||0));
      saveHistory();
      renderHistory(); renderGym();
      alert(`✓ ${nuevas.length} sesión${nuevas.length>1?'es':''} importada${nuevas.length>1?'s':''}.\nTotal historial: ${sessionLog.length} sesiones.`);
    };
    reader.readAsText(file);
  });
  inp.click();
}



/* ── SESSION TIMER ── */
function getTimerKey(dayId) { return dayId + '_timer'; }
function recordSetTime(dayId) {
  const tk = getTimerKey(dayId);
  const now = Date.now();
  if (!gymState[tk]) gymState[tk] = { start: now, end: now };
  else gymState[tk].end = now;
  saveGymState();
}
function fmtMs(ms) {
  const s = Math.floor(ms / 1000);
  const m = Math.floor(s / 60);
  const h = Math.floor(m / 60);
  if (h > 0) return h + 'h ' + (m % 60) + 'min';
  return m + 'min ' + (s % 60) + 'seg';
}
function fmtHHMM(ts) {
  const d = new Date(ts);
  return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
}
function renderTimerHTML(dayId) {
  const tk = getTimerKey(dayId);
  const t = gymState[tk];
  if (!t) return '';
  const dur = t.end - t.start;
  return '<div class="session-timer">' +
    '<div class="st-item"><div class="st-label">Inicio</div><div class="st-val active">' + fmtHHMM(t.start) + '</div></div>' +
    '<div class="st-sep">·</div>' +
    '<div class="st-item"><div class="st-label">Último set</div><div class="st-val">' + fmtHHMM(t.end) + '</div></div>' +
    '<div class="st-sep">·</div>' +
    '<div class="st-item"><div class="st-label">Duración</div><div class="st-val active">' + fmtMs(dur) + '</div></div>' +
  '</div>';
}

/* ═══════════════════════════════════════
   NAVIGATION
═══════════════════════════════════════ */
function setScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('nav-'+name).classList.add('active');
  if (name === 'hist') renderHistory();
}

/* ── INIT ── */
renderTopDate();
renderWeekStrip();
renderGym();
renderHistory();
</script>
